name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Linux checks
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup toolchain install 1.66.0 --profile minimal
          rustup target add --toolchain stable aarch64-unknown-linux-musl

      - name: Check formatting and lints
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy --all-targets --locked --offline -- -D warnings

      - name: Build and test with Rust 1.66
        run: |
          cargo +1.66.0 build --release --locked --offline
          cargo +1.66.0 test --release --locked --offline
          python3 tests/uart_pty.py ./target/release/eld-engine

      - name: Check Linux ABI and AArch64 compilation
        run: |
          cc -std=c11 -Wall -Wextra -Werror -c tests/linux_uapi.c -o "$RUNNER_TEMP/benchmark-uapi.o"
          cargo +stable check --locked --offline --target aarch64-unknown-linux-musl

      - name: Verify release and passive evidence contracts
        run: |
          python3 -B -m unittest discover -s tests -p 'test_*.py'
          python3 -B tests/hub_passive_smoke.py ./target/release/eld-engine

      - name: Check optional codec fixture logic
        run: python3 -B -m unittest discover -s codec

  binary-preflight:
    name: ARM64 and x86-64 binary preflight
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/engine/')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --target aarch64-unknown-linux-musl

      - name: Build and verify internal assets without publishing
        env:
          RUSTUP_TOOLCHAIN: 1.96.0
        run: bash scripts/build-preflight-assets.sh "$RUNNER_TEMP/eld-engine-preflight" v0.2.1-preflight

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eld-engine-unsigned-preflight
          path: ${{ runner.temp }}/eld-engine-preflight/eld-engine-preflight-assets.tar
          if-no-files-found: error
          retention-days: 3
